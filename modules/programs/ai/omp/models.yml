providers:
  # Unofficial Zen Free integration; limited-time availability and upstream client checks may change.
  # User configuration only; no installed OMP files are patched. Snapshot: 2026-10-31.
  # baseUrl is the documented Chat Completions route; free tier is denied on the legacy /inference/v1 path.
  # The gateway also requires OpenCode's <env> system block and OpenCode session headers; the extension adds both.
  # Native tools stay unchanged; restricted/tool-free calls carry protocol metadata without execution permission.
  # Automatic context management stays OMP-native; Zen Free defines no separate compaction model.
  # Provider ZDR/no-training: GLM Flash Free, DeepSeek. Beam/Flint retain 30 days.
  # Big Pickle/MiMo/Flint may improve models; NVIDIA trial is not for confidential code.
  # Chat exposes text/image only; no promise of audio/video/native-PDF support. Jev is judgment-only.
  # Existing non-judge model roles and the Strata provider are unchanged.
  # Radeon Cloud: four account-specific credentials; OMP retry fallback rotates accounts.
  # Radeon Cloud; enter one account API key per provider below.
  amd-account-1:
    baseUrl: https://developer.amd.com.cn/radeon/api/v1
    api: openai-completions
    apiKey: AMD_RADEON_KEY_1
    authHeader: true
    compat: &amdCompat
      supportsStore: false
      supportsDeveloperRole: false
      supportsReasoningEffort: true
      reasoningContentField: reasoning
      maxTokensField: max_tokens
    models: &amdModels
      - id: GLM-5.3-Flash
        name: AMD GLM-5.3-Flash
        contextWindow: 262144
        maxTokens: 131072
        supportsTools: true
        reasoning: true
        input: [text]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
      - id: DeepSeek-V4.1-Flash
        name: AMD DeepSeek-V4.1-Flash
        contextWindow: 1048576
        maxTokens: 384000
        supportsTools: true
        reasoning: true
        input: [text, image]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking: { mode: effort, efforts: [minimal, low, medium, high, xhigh, max] }
      - id: MiMo-V2.6-Flash
        name: AMD MiMo-V2.6-Flash
        contextWindow: 1048576
        maxTokens: 131072
        supportsTools: true
        reasoning: true
        input: [text, image]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking: { mode: effort, efforts: [minimal, low, medium, high, xhigh, max] }
      - id: Qwen3.8-Flash-Next
        name: AMD Qwen3.8-Flash-Next
        contextWindow: 262144
        maxTokens: 262144
        supportsTools: true
        reasoning: true
        input: [text, image]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking: { mode: effort, efforts: [low, medium, xhigh] }
  amd-account-2:
    baseUrl: https://developer.amd.com.cn/radeon/api/v1
    api: openai-completions
    apiKey: AMD_RADEON_KEY_2
    authHeader: true
    compat: *amdCompat
    models: *amdModels
  amd-account-3:
    baseUrl: https://developer.amd.com.cn/radeon/api/v1
    api: openai-completions
    apiKey: AMD_RADEON_KEY_3
    authHeader: true
    compat: *amdCompat
    models: *amdModels
  amd-account-4:
    baseUrl: https://developer.amd.com.cn/radeon/api/v1
    api: openai-completions
    apiKey: AMD_RADEON_KEY_4
    authHeader: true
    compat: *amdCompat
    models: *amdModels
  zen-free:
    baseUrl: https://opencode.ai/inference/openai/v1
    api: openai-completions
    auth: none
    authHeader: false
    headers:
      User-Agent: opencode/latest/2.1.4/cli
      x-opencode-client: cli
      Authorization: Bearer public
    compat:
      supportsStore: false
      supportsDeveloperRole: false
      # The official free-lane client sends plain JSON-schema tools. Strict-mode
      # rewriting mutates schemas (and would break the byte-identical read/shell
      # gate declarations), so keep strict mode off for every zen-free request.
      supportsStrictMode: false
      # Every chat model here is reasoning-capable and the gateway accepts reasoning_effort;
      # declaring false would let a future OMP honor it and silently drop thinking.
      supportsReasoningEffort: true
      reasoningContentField: reasoning_content
      maxTokensField: max_tokens
    models:
      # Operational input window160k (upstream total200k); compaction uses OMP defaults.
      # Conservative local budget, not a hard guard against one oversized prompt.
      - id: "big-pickle"
        name: "Big Pickle (Zen Free; data may improve model)"
        contextWindow: 160000
        maxTokens: 32000
        supportsTools: true
        reasoning: true
        input: [text]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking:
          mode: effort
          efforts: [high, max]
        compat:
          supportsReasoningEffort: true
          supportsForcedToolChoice: false
          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
      - id: "beam-free"
        name: "Beam Free (Zen Free; 30-day safety retention)"
        contextWindow: 1048576
        maxTokens: 131072
        supportsTools: true
        reasoning: true
        input: [text]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking:
          mode: effort
          efforts: [low, medium, high, xhigh, max]
        compat:
          supportsReasoningEffort: true
          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
      - id: "mimo-v2.6-flash-free"
        name: "MiMo-V2.6-Flash Free (Zen Free; data may improve model)"
        contextWindow: 200000
        maxTokens: 32000
        supportsTools: true
        reasoning: true
        input: [text, image]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking:
          mode: effort
          efforts: [low, medium, high]
        compat:
          supportsReasoningEffort: true
          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
      - id: "nemotron-3.5-lightning-free"
        name: "Nemotron 3.5 Lightning (Zen Free trial; no confidential data)"
        contextWindow: 262144
        # Upstream advertises a 262K output cap, but a request whose input plus
        # output can equal the whole window is rejected by OpenAI-compatible
        # servers. Keep a practical 64K output ceiling.
        maxTokens: 65536
        supportsTools: true
        reasoning: true
        input: [text]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh]
        compat:
          supportsReasoningEffort: true
          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
      # Zen-specific catalog: 1M context / 128K output; max_tokens=131072 accepted by the live endpoint.
      - id: "nemotron-3.5-super-vl-free"
        name: "Nemotron 3.5 Super VL (Zen Free trial; no confidential data)"
        contextWindow: 1048576
        maxTokens: 131072
        supportsTools: true
        reasoning: true
        input: [text, image]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh]
        compat:
          supportsReasoningEffort: true
          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
      # Upstream publishes no Jev token limits; do not invent them.
      - id: "jev-1.13-free"
        name: "Jev 1.13 (Zen Free — judgment only)"
        api: "typesafe"
        # Match OMP's built-in opencode-zen seed; the typesafe judgment route
        # appends /v1/systemone itself.
        baseUrl: "https://opencode.ai/zen"
        supportsTools: false
        reasoning: false
        input: [text]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
      - id: "deepseek-v4.1-flash-free"
        name: "DeepSeek V4.1 Flash Free (Zen Free)"
        contextWindow: 200000
        maxTokens: 32000
        supportsTools: true
        reasoning: true
        input: [text, image]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking:
          mode: effort
          efforts: [low, high, max]
        compat:
          supportsReasoningEffort: true
          supportsForcedToolChoice: false
          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
      # Free Zen variant: 200K/32K, not the paid GLM-5.3-Flash 1M/128K limits.
      - id: "glm-5.3-flash-free"
        name: "GLM-5.3-Flash (Zen Free; ZDR/no training)"
        baseUrl: https://opencode.ai/inference/openai/v1
        contextWindow: 200000
        maxTokens: 32000
        supportsTools: true
        reasoning: true
        input: [text, image]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking:
          mode: effort
          efforts: [low, high, max]
        compat:
          supportsReasoningEffort: true
          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
      - id: "flint-40b-free"
        name: "Flint 40B Free (Zen Free; data may improve model)"
        contextWindow: 262144
        maxTokens: 65536
        supportsTools: true
        reasoning: true
        input: [text]
        cost: { input: 0, output: 0, cacheRead: 0, cacheWrite: 0 }
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh]
        compat:
          supportsReasoningEffort: true
          requiresReasoningContentForToolCalls: true
          allowsSyntheticReasoningContentForToolCalls: false
