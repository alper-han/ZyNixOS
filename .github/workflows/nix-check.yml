name: Nix checks

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check Nix syntax
        shell: bash
        run: |
          git ls-files -z -- '*.nix' | while IFS= read -r -d '' file; do
            nix-instantiate --parse "$file" >/dev/null
          done
      - name: Evaluate flake without building
        run: nix flake check --no-build --no-write-lock-file --system x86_64-linux --option allow-import-from-derivation false
      - name: Check formatting
        run: nix fmt -- --ci --tree-root "$GITHUB_WORKSPACE"
